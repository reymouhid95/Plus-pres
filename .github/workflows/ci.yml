name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests unitaires, build
    runs-on: ubuntu-latest
    env:
      # Aucune base n'est requise : seul le générateur Prisma tourne au build.
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  e2e:
    name: Tests end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pluspres
          POSTGRES_PASSWORD: pluspres
          POSTGRES_DB: pluspres_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pluspres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      PORT: "3100"
      DATABASE_URL: postgresql://pluspres:pluspres@localhost:5432/pluspres_test
      DIRECT_URL: postgresql://pluspres:pluspres@localhost:5432/pluspres_test
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium

      # globalSetup de playwright.config.ts applique migrations + purge + seed
      # sur le service Postgres, puis lance `pnpm start` sur le port 3100.
      - name: Tests end-to-end
        run: pnpm test:e2e

      - name: Rapport Playwright
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
